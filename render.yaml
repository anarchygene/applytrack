# Render Blueprint: one Docker web service that serves both the API and the built dashboard.
# The database is Neon PostgreSQL. When Render prompts, paste Neon's pooled connection string
# (hostname contains "-pooler") into DATABASE_URL and the direct one into DATABASE_URL_UNPOOLED,
# which is used only to run migrations on start.
services:
  - type: web
    name: applytrack
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: MIGRATE_ON_START
        value: 'true'
      - key: LOG_LEVEL
        value: info
      # Optional: set to enable AI resume tailoring.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: AI_ALLOW_DEMO
        value: 'false'
