# Local PostgreSQL for development and tests.
# Creates two databases: applytrack (dev) and applytrack_test (integration tests).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack
      POSTGRES_DB: applytrack
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U applytrack']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
